# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - main
env:
  VITE_NEURON_API: "${{ secrets.VITE_NEURON_API }}"
  VITE_NTREE_API: "${{ secrets.VITE_NTREE_API }}"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set lockfile-include-tarball-url false
      - run: |
          sed -i -E 's/, tarball: https:\/\/[^}]+//g' pnpm-lock.yaml
      - run: pnpm install && pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BISURII }}"
          channelId: live
          projectId: bisurii
