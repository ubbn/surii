# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - main
env:
  VITE_NEURON_API: "${{ secrets.VITE_NEURON_API }}"
  VITE_NTREE_API: "${{ secrets.VITE_NTREE_API }}"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    container: ubbn/pnpm:9.15.4
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v3
      - run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set lockfile-include-tarball-url false
      - run: |
          sed -i -E 's/, tarball: https:\/\/[^}]+//g' pnpm-lock.yaml
      - run: pnpm install && pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BISURII }}"
          channelId: live
          projectId: bisurii
